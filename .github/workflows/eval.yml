name: Eval — Regression Detection

on:
  pull_request:
    paths:
      - "prompts/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install "pydantic==2.13.4" "google-genai==2.9.0"

      - name: Find the changed prompt file
        id: find_prompt
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} -- prompts/ | head -1)
          if [ -z "$CHANGED" ]; then
            echo "ERROR: No prompt file changed in this PR."
            exit 1
          fi
          echo "Changed prompt: $CHANGED"
          echo "prompt_file=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run eval
        id: eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e

          # Build the report URL. The report will be published to gh-pages.
          REPORT_BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports"

          python -m mrds run "${{ steps.find_prompt.outputs.prompt_file }}" \
            --report-url "${REPORT_BASE}" \
            2>&1 | tee eval_output.txt
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Find the generated report filename
          REPORT_FILE=$(ls -t reports/*.html 2>/dev/null | head -1)
          if [ -n "$REPORT_FILE" ]; then
            REPORT_NAME=$(basename "$REPORT_FILE")
            echo "report_name=$REPORT_NAME" >> $GITHUB_OUTPUT
            echo "report_url=${REPORT_BASE}/${REPORT_NAME}" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Publish report to GitHub Pages
        if: hashFiles('reports/*.html') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or update gh-pages branch with the report
          git stash --include-untracked || true

          # Check if gh-pages exists remotely
          if git ls-remote --exit-code origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
            echo "# Eval Reports" > index.html
          fi

          # Copy reports
          mkdir -p reports
          git checkout stash -- reports/ 2>/dev/null || true
          # Also try from the working directory
          git stash pop || true
          cp -f reports/*.html reports/ 2>/dev/null || true

          git add reports/
          git commit -m "Publish eval report for PR #${{ github.event.pull_request.number }}" || echo "No changes"
          git push origin gh-pages --force
          git checkout -

      - name: Post eval comment on PR
        if: always() && steps.find_prompt.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Try to read the generated markdown comment
            let body = '';
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch(e) {
              // Fallback if the eval crashed before generating the comment
              const exitCode = '${{ steps.eval.outputs.exit_code }}';
              let output = '';
              try {
                output = fs.readFileSync('eval_output.txt', 'utf8');
              } catch(e2) {
                output = 'No output captured.';
              }
              const lines = output.trim().split('\n').slice(-10).join('\n');
              body = [
                '## Eval Result: ⚠️ ERROR',
                '',
                'The eval crashed before producing results.',
                '',
                '```',
                lines,
                '```',
              ].join('\n');
            }

            // Append the report link if we have one
            const reportUrl = '${{ steps.eval.outputs.report_url }}';
            if (reportUrl && !body.includes(reportUrl)) {
              body += '\n\n📄 [View full HTML report](' + reportUrl + ')';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Upload report artifact (backup)
        if: hashFiles('reports/*.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/*.html
          if-no-files-found: warn

      - name: Block on CRITICAL
        if: steps.eval.outputs.exit_code == '1'
        run: |
          echo "Eval returned CRITICAL. Merge blocked."
          exit 1

  promote:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install "pydantic==2.13.4" "google-genai==2.9.0"

      - name: Find the merged prompt
        id: find_prompt
        run: |
          CHANGED=$(git diff --name-only HEAD~1 -- prompts/ | head -1)
          echo "prompt_file=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run and promote to new baseline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m mrds run "${{ steps.find_prompt.outputs.prompt_file }}" --promote

      - name: Commit new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline.json
          git commit -m "Update baseline after prompt merge" || echo "No changes"
          git push
