[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mrds"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "google-genai>=2.0",
    "pyyaml",
    "jinja2",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
